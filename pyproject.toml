[project]
name = "scribe"
version = "0.1.0"
description = "A readable, regenerable copy of every Claude Code session."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
scribe = "scribe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Only the package. The viewer lives at scribe/viewer/ so it ships as package
# data rather than as a top-level `viewer/` in site-packages, and the CLI is
# reached through the console script above rather than by shipping bin/.
packages = ["scribe"]

[tool.hatch.build.targets.sdist]
include = ["scribe", "bin", "tests", "README.md", "CLAUDE.md", "LICENSE", "pyproject.toml"]
